name: Build Android app
on:
  push:
    branches: [main]
    paths: ["build/app.template.html", "android/**", "package.json", "package-lock.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pvc=${{ github.run_number }} --no-daemon
      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 4K-Pursuit.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android 4K-Pursuit.apk --title "4K Pursuit for Android (build ${{ github.run_number }})" --notes "Install 4K-Pursuit.apk on your phone. Each build installs over the previous one and keeps your log. The training plan itself updates inside the app without a new APK."
